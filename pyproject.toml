[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "e2eps"
version = "0.1.0"
description = "End-to-End Performance Simulator (E2EPS) - physics-level constellation performance modelling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pyinstaller>=6.0"]

[project.scripts]
e2eps = "e2eps.cli:main"

[tool.setuptools.packages.find]
include = ["e2eps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
